name: notes_native_app
description: A native notes app with Ocean Professional styling, CRUD operations, and device-local persistence.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  provider: ^6.0.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.12
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  build_runner: ^2.3.3

flutter:
  uses-material-design: true

